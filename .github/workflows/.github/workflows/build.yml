name: Build KrowBrowser APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Extract ZIP
        run: |
          for z in *.zip; do unzip -o "$z"; done
          ls -la
          if [ -d "KrowBrowser_SPHERE_P1_ULTRA_FINAL" ]; then
            mv KrowBrowser_SPHERE_P1_ULTRA_FINAL/*. || true
          fi
          ls -la
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrowBrowser-Sphere-P1-APK
          path: app/build/outputs/apk/debug/*.apk
